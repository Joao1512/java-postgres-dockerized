services:
  db:
    image: postgres:12.18-bullseye
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: root
    secrets:
      - db-password
    networks:
      - java-postgres
    expose:
      - 5432
    ports:
      - 5433:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgresVolume:/var/lib/postgresql/data
networks:
  java-postgres:
volumes:
  postgresVolume:
secrets:
  db-password:
    file: ./db-password.txt