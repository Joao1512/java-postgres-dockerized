apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-app-java
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java
      type: backend
  template:
    metadata:
      labels:
        app: java
        type: backend
    spec:
      containers:
        - name: java
          image: simaon/java-api
          ports:
            - containerPort: 8080
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_PASSWORD